<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <!-- Hatch pattern for the inner exclusion buffer -->
    <pattern id="innerExclusionHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.35" />
    </pattern>

    <!-- Marker arrows for distance dimension lines -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E293B" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="520" fill="#F8FAFC" rx="12" />

  <!-- Administrative Boundary (Polygon) -->
  <path d="M 50 40 
           L 510 40 
           L 530 180 
           L 500 460 
           L 260 480 
           L 50 440 
           Z" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5" stroke-dasharray="8 6" />

  <text x="65" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#475569">
    Administrative Boundary Constraint (ADM1 + ADM2)
  </text>

  <!-- Concentric Buffers (Center at X: 270, Y: 260) -->
  <!-- Outer Buffer Zone (d_max = 160px) -->
  <circle cx="270" cy="260" r="160" fill="#3B82F6" fill-opacity="0.18" stroke="#2563EB" stroke-width="2" />

  <!-- Inner Exclusion Zone (d_min = 60px) with Hatching -->
  <circle cx="270" cy="260" r="60" fill="url(#innerExclusionHatch)" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Dimension Lines & Radii Labels -->
  <!-- d_min indicator -->
  <line x1="270" y1="260" x2="225" y2="220" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <rect x="180" y="210" width="46" height="20" rx="4" fill="#FEE2E2" />
  <text x="186" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#B91C1C">d_min</text>

  <!-- d_max indicator -->
  <line x1="270" y1="260" x2="390" y2="155" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="345" y="180" width="50" height="20" rx="4" fill="#E2E8F0" />
  <text x="352" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">d_max</text>

  <!-- Original Point Marker (Center) -->
  <circle cx="270" cy="260" r="6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="2" />
  <text x="282" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">
    Original Point
  </text>
  <text x="282" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">
    (old_Latitude, old_Longitude)
  </text>

  <!-- Displaced Point Marker (Candidate within annulus) -->
  <g transform="translate(345, 335)">
    <!-- Selection highlight circle -->
    <circle cx="0" cy="0" r="14" fill="#10B981" fill-opacity="0.25" />
    <circle cx="0" cy="0" r="6" fill="#059669" stroke="#FFFFFF" stroke-width="2" />
    <!-- Cross marker symbol -->
    <path d="M -3 -3 L 3 3 M 3 -3 L -3 3" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="16" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065F46">
      Displaced Point
    </text>
    <text x="16" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#047857">
      (Latitude, Longitude)
    </text>
  </g>

  <!-- Legend Panel -->
  <g transform="translate(560, 50)">
    <rect width="210" height="400" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A">
      Legend
    </text>

    <!-- Legend: Original Point -->
    <circle cx="28" cy="72" r="5" fill="#1D4ED8" />
    <text x="44" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Original Point</text>
    <text x="44" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Source coordinates</text>

    <!-- Legend: Displaced Point -->
    <circle cx="28" cy="130" r="5" fill="#059669" />
    <text x="44" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Displaced Point</text>
    <text x="44" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Selected valid candidate</text>

    <!-- Legend: Valid Annular Zone -->
    <rect x="20" y="185" width="16" height="16" rx="3" fill="#3B82F6" fill-opacity="0.3" stroke="#2563EB" stroke-width="1.2" />
    <text x="44" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Displacement Zone</text>
    <text x="44" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">d_min ≤ dist ≤ d_max</text>

    <!-- Legend: Exclusion Zone -->
    <rect x="20" y="248" width="16" height="16" rx="3" fill="url(#innerExclusionHatch)" stroke="#DC2626" stroke-width="1.2" />
    <text x="44" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Exclusion Zone</text>
    <text x="44" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">dist < d_min</text>

    <!-- Legend: Boundary Constraint -->
    <line x1="20" y1="316" x2="36" y2="316" stroke="#64748B" stroke-width="2" stroke-dasharray="4 2" />
    <text x="44" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Admin Boundary</text>
    <text x="44" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Displacement boundary</text>
  </g>
</svg>